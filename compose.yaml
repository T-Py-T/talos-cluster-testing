name: talos-workshop

# Image tag must match lab-versions.env (enforced by scripts/check-pins.sh).
x-talos-version: &talos_version v1.14.2

volumes:
  cp-state:
  worker-state:

services:
  talos-cp:
    image: ghcr.io/siderolabs/talos:*talos_version
    hostname: talos-cp
    environment:
      - PLATFORM=container
    read_only: true
    privileged: true
    security_opt:
      - seccomp=unconfined
    volumes:
      - type: volume
        target: /var
      - type: volume
        target: /etc/cni
      - type: volume
        target: /etc/kubernetes
      - type: volume
        target: /usr/libexec/kubernetes
      - type: volume
        target: /opt
      - cp-state:/system/state
    tmpfs:
      - /run
      - /system
      - /tmp
  talos-worker:
    image: ghcr.io/siderolabs/talos:*talos_version
    hostname: talos-worker
    environment:
      - PLATFORM=container
    read_only: true
    privileged: true
    security_opt:
      - seccomp=unconfined
    volumes:
      - type: volume
        target: /var
      - type: volume
        target: /etc/cni
      - type: volume
        target: /etc/kubernetes
      - type: volume
        target: /usr/libexec/kubernetes
      - type: volume
        target: /opt
      - worker-state:/system/state
    tmpfs:
      - /run
      - /system
      - /tmp
