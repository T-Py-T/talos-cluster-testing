name: Build Omarchy 4.0.1 ARM64 ISO

on:
  workflow_dispatch:
  push:
    branches:
      - omarchy-arm64-iso-v4.0.1
    paths:
      - .github/workflows/omarchy-arm64-iso.yml
      - omarchy-arm64/**

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-and-validate:
    name: Native ARM64 build and QEMU validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Check out orchestration repository
        uses: actions/checkout@v4

      - name: Confirm native runner architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = "aarch64"
          uname -a

      - name: Install build and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            arch-install-scripts \
            binutils \
            bsdextrautils \
            ca-certificates \
            curl \
            dosfstools \
            expect \
            file \
            git \
            jq \
            libarchive-tools \
            mtools \
            qemu-efi-aarch64 \
            qemu-system-arm \
            qemu-utils \
            rsync \
            squashfs-tools \
            xorriso \
            zstd
          sudo systemctl start docker || true
          docker version || true

      - name: Build Omarchy 4.0.1 ARM64 ISO
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./omarchy-arm64/build.sh

      - name: Validate ISO and perform AArch64 UEFI smoke test
        shell: bash
        run: ./omarchy-arm64/validate.sh

      - name: Add validation results to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Omarchy 4.0.1 ARM64 ISO'
            echo
            if [[ -f omarchy-arm64/dist/validation/result.txt ]]; then
              echo "Validation: **$(cat omarchy-arm64/dist/validation/result.txt)**"
            else
              echo 'Validation: **FAILED OR INCOMPLETE**'
            fi
            if [[ -f omarchy-arm64/dist/omarchy-4.0.1-aarch64.iso.sha256 ]]; then
              echo
              echo '```text'
              cat omarchy-arm64/dist/omarchy-4.0.1-aarch64.iso.sha256
              echo '```'
            fi
            if [[ -f omarchy-arm64/dist/manifest/omarchy-iso.commit ]]; then
              echo
              echo "ISO source: \`$(cat omarchy-arm64/dist/manifest/omarchy-iso.commit)\`"
            fi
            if [[ -f omarchy-arm64/dist/manifest/omarchy-patched.commit ]]; then
              echo "Patched Omarchy source: \`$(cat omarchy-arm64/dist/manifest/omarchy-patched.commit)\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-4.0.1-aarch64-diagnostics-${{ github.run_attempt }}
          path: |
            omarchy-arm64/dist/build.log
            omarchy-arm64/dist/manifest
            omarchy-arm64/dist/validation
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Upload validated ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-4.0.1-aarch64-iso
          path: |
            omarchy-arm64/dist/omarchy-4.0.1-aarch64.iso
            omarchy-arm64/dist/omarchy-4.0.1-aarch64.iso.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
