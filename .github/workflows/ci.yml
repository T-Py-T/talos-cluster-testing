name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint

      - name: YAML lint
        run: yamllint -c .yamllint.yml compose.yaml .github/workflows/ci.yml .github/dependabot.yml

      - name: Shellcheck
        run: shellcheck scripts/check-pins.sh .devcontainer/setup.sh

      - name: Talos and kubectl pin consistency
        run: bash scripts/check-pins.sh

      - name: Validate Compose file
        run: docker compose -f compose.yaml config

  trivy-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          exit-code: 1
          severity: CRITICAL,HIGH
