name: Lab validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run policy tests
        run: pytest tests/ -q

      - name: Validate Compose resolves (Docker)
        run: |
          docker compose -f compose.yaml config --quiet
          services="$(docker compose -f compose.yaml config --format json | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(sorted(d.get('services',{}))))")"
          test "$services" = "talos-cp talos-worker"
